<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spaceship Titanic · Intelligence Lab</title>
    <meta
      name="description"
      content="Explora señales, simula pasajeros y entiende el modelo de Spaceship Titanic."
    />
    <meta name="theme-color" content="#191722" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- El tema se aplica ANTES de pintar. Si esperara a React, la página
         parpadearía en blanco antes de volverse oscura. -->
    <script>
      try {
        var t = localStorage.getItem("tema");
        if (t === "light" || t === "dark")
          document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
